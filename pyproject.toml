[project]
name = "adk-a2a-sample"
version = "0.1.0"
description = "Production-ready Google ADK 2.0 Agent-to-Agent (A2A) boilerplate with Clean Code and DDD architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk[a2a,gcp]>=0.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "sse-starlette>=3.4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adk_a2a"]


# ──────────────────────────────────────────────
#  Ruff — Fast Python linter + formatter
# ──────────────────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming — enforces meaningful names
  "UP",   # pyupgrade
  "B",    # flake8-bugbear — opinionated correctness
  "C90",  # mccabe complexity
  "SIM",  # flake8-simplify — reduces nesting/complexity
  "ANN",  # type annotations
  "PTH",  # use pathlib instead of os.path
  "RUF",  # ruff-specific rules
]
ignore = [
  "E501",    # line length handled by formatter
]

[tool.ruff.lint.mccabe]
# Flag functions with cyclomatic complexity > 10
max-complexity = 10

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "pydantic.validator"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ──────────────────────────────────────────────
#  Mypy — Static type checking
# ──────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_any_explicit = false
no_implicit_optional = true
show_error_codes = true
packages = ["adk_a2a"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "google.*",
]
ignore_missing_imports = true

# ──────────────────────────────────────────────
#  Bandit — Security linting
# ──────────────────────────────────────────────

[tool.bandit]
targets = ["src"]
skips = []

# ──────────────────────────────────────────────
#  Pytest — Automated test suite
# ──────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
